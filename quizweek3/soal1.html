<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Quiz Kelas</title>
    <style>
        body { font-family: serif; padding: 20px; line-height: 1.6; }
        button { cursor: pointer; margin-bottom: 20px; }
        #display { 
            display: none; 
            margin-bottom: 10px; 
        }
    </style>
</head>
<body>

    <button onclick="increaseCounter()">Click me!</button>

    <div id="display"></div>

    <p>Click the button to see the counter increase.</p>
    <p>Close the browser tab (or window), and try again, and the counter is reset.</p>

    <script>
        let count = localStorage.getItem('userClicks') || 0;

        function increaseCounter() {
            count++;
            localStorage.setItem('userClicks', count);
            const displayElement = document.getElementById('display');
            displayElement.innerText = `You have clicked the button ${count} time(s) in this session.`;
            displayElement.style.display = 'block';
        }
    </script>

</body>
</html>
